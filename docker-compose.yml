version: "3.9"

# ============================================================
#  AGI Agent - Docker Compose
#  Full-stack orchestration for local/demo deployment
# ============================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  restart: unless-stopped

networks:
  agi-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  workspace_data:
  artifact_data:

services:

  # --------------------------------------------------------
  # POSTGRES - Durable memory & task storage
  # --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    <<: *default-restart
    logging: *default-logging
    networks:
      - agi-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agi_agent}
      POSTGRES_USER: ${POSTGRES_USER:-agi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agi_user} -d ${POSTGRES_DB:-agi_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "5432:5432"

  # --------------------------------------------------------
  # REDIS - Session state & event queuing
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    <<: *default-restart
    logging: *default-logging
    networks:
      - agi-net
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-change-me-redis-password}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # --------------------------------------------------------
  # CHROMADB - Vector store for semantic memory
  # --------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    <<: *default-restart
    logging: *default-logging
    networks:
      - agi-net
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      CHROMA_SERVER_AUTHN_CREDENTIALS: ""
      CHROMA_SERVER_AUTHN_PROVIDER: ""
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "8001:8000"

  # --------------------------------------------------------
  # BACKEND - FastAPI orchestration engine
  # --------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    <<: *default-restart
    logging: *default-logging
    networks:
      - agi-net
    volumes:
      - workspace_data:/tmp/agi_workspace
      - artifact_data:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-http://localhost:3000}
      - OPENROUTER_SITE_NAME=${OPENROUTER_SITE_NAME:-AGI-Agent-Demo}
      - PREFER_FREE_MODELS=${PREFER_FREE_MODELS:-true}
      - MAX_BUDGET_USD=${MAX_BUDGET_USD:-5.00}
      - DEFAULT_PLANNING_MODEL=${DEFAULT_PLANNING_MODEL:-meta-llama/llama-3.3-70b-instruct:free}
      - DEFAULT_CODING_MODEL=${DEFAULT_CODING_MODEL:-deepseek/deepseek-r1:free}
      - DEFAULT_WEB_MODEL=${DEFAULT_WEB_MODEL:-google/gemma-3-27b-it:free}
      - DEFAULT_GENERAL_MODEL=${DEFAULT_GENERAL_MODEL:-mistralai/mistral-7b-instruct:free}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-false}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_DEFAULT_MODEL=${OLLAMA_DEFAULT_MODEL:-llama3.2}
      - HYPERBROWSER_API_KEY=${HYPERBROWSER_API_KEY:-}
      - HYPERBROWSER_BASE_URL=${HYPERBROWSER_BASE_URL:-https://api.hyperbrowser.ai}
      - WAVESPEED_API_KEY=${WAVESPEED_API_KEY:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - SERP_API_KEY=${SERP_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://agi_user:change-me-strong-password@postgres:5432/agi_agent}
      - REDIS_URL=${REDIS_URL:-redis://:change-me-redis-password@redis:6379/0}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - REQUIRE_APPROVAL_CODE_EXECUTION=${REQUIRE_APPROVAL_CODE_EXECUTION:-true}
      - REQUIRE_APPROVAL_FILE_WRITES=${REQUIRE_APPROVAL_FILE_WRITES:-false}
      - REQUIRE_APPROVAL_WEB_REQUESTS=${REQUIRE_APPROVAL_WEB_REQUESTS:-false}
      - MAX_RETRIES_PER_STEP=${MAX_RETRIES_PER_STEP:-3}
      - TOOL_EXECUTION_TIMEOUT_SECONDS=${TOOL_EXECUTION_TIMEOUT_SECONDS:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "8000:8000"

  # --------------------------------------------------------
  # FRONTEND - Next.js UI
  # --------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-AGI Agent}
        BUILDKIT_INLINE_CACHE: "1"
    <<: *default-restart
    logging: *default-logging
    networks:
      - agi-net
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-AGI Agent}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    ports:
      - "3000:3000"

  # --------------------------------------------------------
  # NGINX - Reverse proxy + SSL termination
  # --------------------------------------------------------
  nginx:
    image: nginx:alpine
    <<: *default-restart
    logging: *default-logging
    networks:
      - agi-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
